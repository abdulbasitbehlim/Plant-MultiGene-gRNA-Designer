[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-multigene-grna-designer"
version = "1.3.1"
description = "Seed-exhaustive SpCas9 shared-guide design across multiple plant genes"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Abdul Basit Behlim"}]
dependencies = [
  "biopython==1.86", "pandas==2.2.3", "requests==2.32.5", "plotly==6.5.2"
]
[tool.setuptools]
py-modules = ["plant_multiguide", "sequence_sources", "validation"]
